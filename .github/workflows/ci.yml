name: CI

# Запуск при каждом push в любую ветку, при pull request и вручную (кнопка Run workflow)
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Integration tests (mvn test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Run tests
        run: mvn -B test

      - name: Test summary
        if: always()
        run: |
          echo "## Результаты тестов" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
            grep -h "Tests run" target/surefire-reports/*.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Отчёты surefire не найдены (сборка упала до запуска тестов)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
